product: apim
version: 4.3.0

repos:
  - name: carbon-apimgt
    branch: master
  - name: product-apim
    branch: master
  - name: apim-apps
    branch: main
  - name: docs-apim
    branch: 4.3.0

build:
  pack_zip_pattern: "wso2am-*.zip"
  pack_source: ""

runtime:
  startup_command: "sh api-manager.sh"
  health_check_log: "Mgt Console URL"
  default_ports: [9443, 9763, 8280, 8243, 5672]
  startup_timeout_seconds: 180

phase_limits:
  reproduce: 10.0
  risk-assessment: 2.0
  plan-and-fix: 15.0
  verify: 10.0
  test-coverage: 10.0
  pr: 5.0

skip_phases: []

skills_ref: "api-manager-specific/v4"
